# Development: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: site
      POSTGRES_PASSWORD: site
      POSTGRES_DB: site
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U site"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://site:site@db:5432/site   # overrides .env inside Docker
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    volumes: ["./app:/code/app"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
volumes:
  pgdata:

